services:
  mysql:
    image: mysql:8.4
    container_name: reactor-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: reactor
      MYSQL_USER: reactor
      MYSQL_PASSWORD: reactor123
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - mysql-data:/var/lib/mysql

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reactor-app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: reactor
      MYSQL_USER: reactor
      MYSQL_PASSWORD: reactor123
      # Only a local development default; override it for anything beyond this machine.
      REACTOR_ADMIN_PASSWORD: ${REACTOR_ADMIN_PASSWORD:-reactor-dev}
    ports:
      - "8080:8080"
    healthcheck:
      # TCP connect check: the JRE base image ships no curl/wget.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Observability stack (PRD 6.1: Micrometer/Prometheus + Grafana). It hangs behind the
  # `monitoring` profile so the default `docker compose up` (mysql + app) stays unchanged:
  #   docker compose --profile monitoring up -d
  # Grafana: http://localhost:3000 (anonymous read-only viewer), dashboards auto-provisioned
  # from deploy/grafana/dashboards. Prometheus: http://localhost:9090
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: reactor-prometheus
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.3.1
    container_name: reactor-grafana
    profiles: ["monitoring"]
    depends_on:
      - prometheus
    environment:
      # Anonymous read-only viewer keeps the local demo friction-free; anything beyond this
      # machine must set its own credentials instead.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"

volumes:
  mysql-data:
