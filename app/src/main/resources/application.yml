spring:
  application:
    name: reactor
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:reactor}?connectionTimeZone=UTC&characterEncoding=UTF-8
    username: ${MYSQL_USER:reactor}
    password: ${MYSQL_PASSWORD:reactor123}
    hikari:
      maximum-pool-size: 16
      pool-name: reactor-pool
  flyway:
    enabled: true
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # Enums are stored as their name (PENDING, SUCCEEDED, ...) so rows stay readable in SQL.
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
  global-config:
    banner: false

server:
  port: 8080

reactor:
  worker:
    enabled: true
    concurrency: 4
    poll-interval: 500ms
    batch-size: 10
    lease-ttl: 60s
    # Lease renewal defaults to lease-ttl / 3 (here 20s); set it explicitly when you want a
    # different heartbeat. It must stay below lease-ttl, otherwise the task would be reclaimed
    # while it is still running.
    lease-renew-interval: 20s
    # Optional per task-type concurrency cap, e.g.
    # task-type-limits:
    #   report: 2
  retry:
    base-delay: 1s
    multiplier: 2.0
    max-delay: 5m
    jitter: 0.2
    # Upper bound of retry dispatches per second, so a wave of failures cannot crowd out the
    # normal tasks (PRD 5.4). Set to 0 to disable the limit.
    max-dispatches-per-second: 20
  recovery:
    enabled: true
    scan-interval: 5s
    batch-size: 50
    orphan-sweep-enabled: true
  # Adaptive concurrency control (PRD 5.5). Disabled by default so the engine keeps the fixed
  # concurrency semantics unless the experiment explicitly turns it on.
  adaptive:
    enabled: false
    min-concurrency: 1
    max-concurrency: 8
    initial-concurrency: 4
    sample-interval: 2s
    latency-threshold: 500ms
    error-rate-threshold: 0.3
    timeout-rate-threshold: 0.2
    increase-step: 1
    decrease-factor: 0.5
    max-decrease-step: 4
    cooldown: 10s
    consecutive-breaches-before-decrease: 2
    recovery-observation: 15s
    conservative-concurrency: 1
  # Simulated downstream used by the fault experiments and by the `downstream` task type.
  fault-lab:
    latency-ms: 0
    jitter-ms: 0
    error-rate: 0.0
    failure-kind: TRANSIENT
    retry-after-ms: 2000
    seed: 0
  # Authentication and authorization for the management endpoints (PRD 8.4): task cancel, task
  # replay and fault injection require a user with the ADMIN role. The default password is for
  # local development only - override REACTOR_ADMIN_PASSWORD anywhere else.
  security:
    users:
      admin:
        password: ${REACTOR_ADMIN_PASSWORD:reactor-dev}
        roles: ADMIN

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info

logging:
  level:
    com.yuki.reactor: INFO
